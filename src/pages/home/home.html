<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="settings()">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>
      <div class="title-content">
        <ion-icon name="leaf-outline" class="logo-icon"></ion-icon>
        Nature Net Kids
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="help()">
        <ion-icon name="help-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="home-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Nature Net Kids</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="content-wrapper">
    <!-- User Profile Card -->
    <ion-card class="profile-card" *ngIf="auth.currentUser">
      <ion-card-content>
        <div class="profile-header">
          <ion-avatar class="profile-avatar">
            <div class="avatar-placeholder">
              <ion-icon name="person"></ion-icon>
            </div>
          </ion-avatar>
          <div class="profile-info">
            <h2 class="user-name">{{auth.currentUser}}</h2>
            <div class="user-stats">
              <ion-chip color="success">
                <ion-icon name="star"></ion-icon>
                <ion-label>0 Points</ion-label>
              </ion-chip>
              <ion-chip color="secondary">
                <ion-icon name="images"></ion-icon>
                <ion-label>0 Photos</ion-label>
              </ion-chip>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Welcome Card for non-logged in users -->
    <ion-card class="welcome-card" *ngIf="!auth.currentUser">
      <ion-card-content>
        <div class="welcome-content">
          <ion-icon name="leaf" color="primary" class="welcome-icon"></ion-icon>
          <h2>Welcome to Nature Net Kids!</h2>
          <p>Explore nature and share your discoveries</p>
          <ion-button expand="block" (click)="goToSignup()" color="primary">
            Get Started
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Action Cards -->
    <div class="action-cards">
      <ion-card class="action-card camera-card" button (click)="takePhotoPage()">
        <ion-card-content>
          <div class="card-icon-wrapper">
            <ion-icon name="camera" color="primary"></ion-icon>
          </div>
          <h3>Add Picture</h3>
          <p>Capture and share nature observations</p>
        </ion-card-content>
      </ion-card>

      <ion-card class="action-card gallery-card" button (click)="seeProjects()">
        <ion-card-content>
          <div class="card-icon-wrapper">
            <ion-icon name="images" color="secondary"></ion-icon>
          </div>
          <h3>View Gallery</h3>
          <p>Browse nature discoveries</p>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
