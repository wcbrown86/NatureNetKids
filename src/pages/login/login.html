<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="home()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="help()">
        <ion-icon name="help-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-circle">
        <ion-icon name="leaf" color="primary"></ion-icon>
      </div>
      <h1>Welcome Back!</h1>
      <p>Login to continue your nature journey</p>
    </div>

    <!-- Login Form Card -->
    <ion-card class="login-card">
      <ion-card-content>
        <form [formGroup]="loginForm" novalidate>
          <!-- Email Input -->
          <div class="input-group">
            <ion-item lines="none" class="input-item" [class.item-has-error]="!email.valid && email.touched">
              <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
              <ion-input 
                type="email" 
                placeholder="Email address" 
                formControlName="email"
                clearInput="true">
              </ion-input>
            </ion-item>
            <div class="error-message" *ngIf="!email.valid && email.touched">
              <ion-text color="danger" *ngIf="email.hasError('required')">
                <small>Email is required</small>
              </ion-text>
              <ion-text color="danger" *ngIf="email.hasError('pattern') && !email.hasError('required')">
                <small>Please enter a valid email</small>
              </ion-text>
            </div>
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <ion-item lines="none" class="input-item" [class.item-has-error]="!password.valid && password.touched">
              <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
              <ion-input 
                type="password" 
                placeholder="Password" 
                formControlName="password"
                clearInput="true">
              </ion-input>
            </ion-item>
            <div class="error-message" *ngIf="!password.valid && password.touched">
              <ion-text color="danger" *ngIf="password.hasError('required')">
                <small>Password is required</small>
              </ion-text>
              <ion-text color="danger" *ngIf="password.hasError('minlength') && !password.hasError('required')">
                <small>Password must be at least 6 characters</small>
              </ion-text>
            </div>
          </div>

          <!-- Login Button -->
          <ion-button 
            expand="block" 
            (click)="login()" 
            color="primary"
            class="login-button">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            Login
          </ion-button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span>or</span>
        </div>

        <!-- Signup Button -->
        <ion-button 
          expand="block" 
          (click)="goToSignup()" 
          fill="outline"
          color="secondary"
          class="signup-button">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Create Account
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
